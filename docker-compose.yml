services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btpreply}
      POSTGRES_USER: ${POSTGRES_USER:-btpreply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btpreply}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Forcer l'hôte de la DB sur le service `db` (le .env peut contenir une autre valeur)
      DATABASE_URL: postgresql://${POSTGRES_USER:-btpreply}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-btpreply}
      ANTHROPIC_MODEL_QUALIFICATION: ${ANTHROPIC_MODEL_QUALIFICATION:-claude-haiku-4-5}
    healthcheck:
      # node est toujours présent dans l'image ; curl/wget pas garantis.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-btpreply}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-btpreply}
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # Le repo n'a pas de dossier prisma/migrations : `migrate deploy` ne faisait
    # rien et le schéma prod dérivait du code. `db push` synchronise directement
    # depuis schema.prisma (idempotent). Si on adopte de vraies migrations un
    # jour : baseliner d'abord, puis revenir à `migrate deploy`.
    command: pnpm exec prisma db push --skip-generate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-btpreply}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-btpreply}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
